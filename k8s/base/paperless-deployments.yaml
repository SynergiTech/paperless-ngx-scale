apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-web
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: [sh, -c, 'until nc -z postgres 5432 && nc -z redis 6379; do sleep 2; done']
      containers:
        - name: web
          image: paperless-web:2.20.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: paperless-config
            - secretRef:
                name: paperless-secrets
          env:
            - name: PAPERLESS_TASK_WORKERS
              value: "0"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "0"
            - name: PAPERLESS_WEBSERVER_WORKERS
              value: "2"
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
            - name: tmp
              mountPath: /tmp/paperless
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            initialDelaySeconds: 90
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export
        - name: tmp
          persistentVolumeClaim:
            claimName: paperless-tmp
---
